<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Discovery Recognitions</title>
  <style>
    :root {
      color-scheme: light dark;
      --page-background: #f5f5f7;
      --panel-background: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --border-color: #d2d2d7;
      --accent-color: #0a84ff;
      --success-color: #32d74b;
      --error-color: #ff453a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-background: #000000;
        --panel-background: #1c1c1e;
        --text-primary: #f5f5f7;
        --text-secondary: #8e8e93;
        --border-color: #3a3a3c;
        --accent-color: #0a84ff;
        --success-color: #30d158;
        --error-color: #ff453a;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: var(--page-background);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 32px;
    }

    .layout {
      max-width: 1024px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-background);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 14px;
    }

    input {
      background: transparent;
      color: var(--text-primary);
      padding: 11px 12px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .meta-line {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
      word-break: break-word;
    }

    .status-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-item {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-item.active {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .status-item.completed {
      border-color: var(--success-color);
      color: var(--success-color);
    }

    .status-item.failed {
      border-color: var(--error-color);
      color: var(--error-color);
    }

    .payload {
      margin-top: 16px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      min-height: 240px;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-text {
      color: var(--error-color);
      margin-top: 12px;
      font-size: 13px;
    }

    .places-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .place-item {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text-primary);
    }

    .place-item.muted {
      padding: 10px 12px;
      font-size: 14px;
      font-style: italic;
      color: var(--text-secondary);
    }

    .place-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 12px;
    }

    .place-thumb {
      width: 76px;
      height: 76px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border-color);
    }

    .place-thumb-slot {
      width: 76px;
      height: 76px;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--page-background);
      border: 1px dashed var(--border-color);
    }

    .place-body {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      line-height: 1.45;
    }

    .place-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .place-address {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .place-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .place-rating {
      color: #e6a000;
    }

    @media (prefers-color-scheme: dark) {
      .place-rating {
        color: #ffd60a;
      }
    }

    .place-price {
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .place-actions {
      margin-top: 10px;
    }

    .place-instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border-color);
      background: var(--panel-background);
      color: var(--accent-color);
      cursor: pointer;
      transition: opacity 0.15s ease, border-color 0.15s ease;
    }

    .place-instagram-link:hover {
      opacity: 0.9;
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="panel">
      <h1>Recognition Test</h1>
      <div class="field-label">Instagram URL</div>
      <input id="source-url-input" type="url" placeholder="https://www.instagram.com/reel/..." />
      <button id="start-recognition-button">Start Recognition</button>
      <div class="meta-line" id="recognition-id-line">recognition_id: —</div>
      <div class="meta-line" id="connection-line">Realtime: disconnected</div>
      <div class="meta-line" id="duration-line">Total duration: —</div>
      <div class="error-text" id="error-line"></div>
    </section>

    <section class="panel">
      <div class="field-label">Lifecycle</div>
      <ul class="status-list" id="status-list"></ul>
      <div class="field-label" style="margin-top:16px">Payload</div>
      <div class="payload" id="payload-output">No payload yet.</div>
      <div class="field-label" style="margin-top:16px">Places (GET /recognitions/result)</div>
      <ul class="places-list" id="places-list">
        <li class="place-item muted">—</li>
      </ul>
    </section>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const recognitionStatuses = [
      "queued",
      "processing",
      "completed",
      "failed",
      "committed",
      "cancelled",
      "expired",
    ];

    const sourceUrlInput = document.getElementById("source-url-input");
    const startRecognitionButton = document.getElementById("start-recognition-button");
    const recognitionIdentifierLine = document.getElementById("recognition-id-line");
    const connectionLine = document.getElementById("connection-line");
    const durationLine = document.getElementById("duration-line");
    const errorLine = document.getElementById("error-line");
    const statusList = document.getElementById("status-list");
    const payloadOutput = document.getElementById("payload-output");
    const placesList = document.getElementById("places-list");

    let authToken = "";
    let supabaseClient = null;
    let activeSubscription = null;
    let activeRecognitionId = null;
    let lastFetchedResultId = null;
    let recognitionStartedAtMilliseconds = null;
    let durationIntervalId = null;

    function clearDurationInterval() {
      if (durationIntervalId) {
        clearInterval(durationIntervalId);
        durationIntervalId = null;
      }
    }

    function formatElapsedSeconds(milliseconds) {
      return (milliseconds / 1000).toFixed(1);
    }

    /**
     * Instagram web profile (same as “Copy link” / address bar on instagram.com).
     * Pattern: https://www.instagram.com/<username>/
     * “@” is display-only; it must not appear in the path segment.
     */
    function instagramProfileWebUrl(rawUsername) {
      const handle = String(rawUsername ?? "")
        .trim()
        .replace(/^@+/u, "")
        .toLocaleLowerCase("en");
      if (!handle) return null;
      return `https://www.instagram.com/${encodeURIComponent(handle)}/`;
    }

    function startDurationTracking() {
      clearDurationInterval();
      recognitionStartedAtMilliseconds = Date.now();
      durationLine.textContent = "Total duration: 0.0s";
      durationIntervalId = setInterval(() => {
        if (!recognitionStartedAtMilliseconds) return;
        const elapsedMilliseconds = Date.now() - recognitionStartedAtMilliseconds;
        durationLine.textContent = `Total duration: ${formatElapsedSeconds(elapsedMilliseconds)}s`;
      }, 100);
    }

    function finalizeDurationTracking() {
      if (!recognitionStartedAtMilliseconds) return;
      const elapsedMilliseconds = Date.now() - recognitionStartedAtMilliseconds;
      clearDurationInterval();
      durationLine.textContent = `Total duration: ${formatElapsedSeconds(elapsedMilliseconds)}s`;
    }

    function renderStatusList(activeStatus) {
      statusList.innerHTML = "";
      for (const status of recognitionStatuses) {
        const listItem = document.createElement("li");
        listItem.className = "status-item";
        listItem.textContent = status;
        if (status === activeStatus) {
          listItem.classList.add("active");
          if (status === "completed" || status === "committed") listItem.classList.add("completed");
          if (status === "failed" || status === "cancelled" || status === "expired") listItem.classList.add("failed");
        }
        statusList.appendChild(listItem);
      }
    }

    function setError(message) {
      errorLine.textContent = message ? `⚠ ${message}` : "";
    }

    function renderPayload(payload) {
      payloadOutput.textContent = JSON.stringify(payload, null, 2);
    }

    function renderPlacesList(items) {
      placesList.innerHTML = "";
      if (!Array.isArray(items) || items.length === 0) {
        const li = document.createElement("li");
        li.className = "place-item muted";
        li.textContent = "No places in this result.";
        placesList.appendChild(li);
        return;
      }
      for (const entry of items) {
        const li = document.createElement("li");
        li.className = "place-item";
        const row = document.createElement("div");
        row.className = "place-row";

        const thumbUrl =
          entry &&
          typeof entry === "object" &&
          entry !== null &&
          typeof entry.thumbnailUrl === "string" &&
          entry.thumbnailUrl.length > 0
            ? entry.thumbnailUrl
            : null;

        if (thumbUrl) {
          const img = document.createElement("img");
          img.className = "place-thumb";
          img.src = thumbUrl;
          img.alt = "";
          img.loading = "lazy";
          img.referrerPolicy = "no-referrer";
          row.appendChild(img);
        } else {
          const slot = document.createElement("div");
          slot.className = "place-thumb-slot";
          slot.setAttribute("aria-hidden", "true");
          row.appendChild(slot);
        }

        const place = entry && typeof entry === "object" && entry !== null ? entry.place : null;
        const name =
          place && typeof place.name === "string" && place.name.length > 0 ? place.name : "(unnamed)";
        const addr =
          place && typeof place.address === "string" && place.address.length > 0 ? place.address : "";

        const body = document.createElement("div");
        body.className = "place-body";
        const titleEl = document.createElement("div");
        titleEl.className = "place-title";
        titleEl.textContent = name;
        body.appendChild(titleEl);

        const rating =
          place && typeof place.rating === "number" && !Number.isNaN(place.rating) ? place.rating : null;
        const priceLevelRaw =
          place && typeof place.priceLevel === "number" && !Number.isNaN(place.priceLevel)
            ? place.priceLevel
            : null;
        const priceLabel =
          priceLevelRaw !== null && priceLevelRaw >= 1 && priceLevelRaw <= 4
            ? "$".repeat(priceLevelRaw)
            : null;

        if (rating !== null || priceLabel !== null) {
          const metaEl = document.createElement("div");
          metaEl.className = "place-meta";
          if (rating !== null) {
            const ratingSpan = document.createElement("span");
            ratingSpan.className = "place-rating";
            ratingSpan.textContent = `★ ${rating.toFixed(1)}`;
            ratingSpan.setAttribute("title", "Google rating");
            metaEl.appendChild(ratingSpan);
          }
          if (priceLabel !== null) {
            const priceSpan = document.createElement("span");
            priceSpan.className = "place-price";
            priceSpan.textContent = priceLabel;
            priceSpan.setAttribute("title", "Price level");
            metaEl.appendChild(priceSpan);
          }
          body.appendChild(metaEl);
        }

        if (addr) {
          const addrEl = document.createElement("div");
          addrEl.className = "place-address";
          addrEl.textContent = addr;
          body.appendChild(addrEl);
        }

        const igRaw =
          entry &&
          typeof entry === "object" &&
          entry !== null &&
          typeof entry.instagramUsername === "string" &&
          entry.instagramUsername.trim().length > 0
            ? entry.instagramUsername.trim().replace(/^@+/, "")
            : null;

        if (igRaw) {
          const profileUrl = instagramProfileWebUrl(igRaw);
          if (profileUrl) {
            const actionsEl = document.createElement("div");
            actionsEl.className = "place-actions";
            const igLink = document.createElement("a");
            igLink.className = "place-instagram-link";
            igLink.href = profileUrl;
            igLink.target = "_blank";
            igLink.rel = "noopener noreferrer";
            igLink.textContent = `Instagram · @${igRaw}`;
            igLink.setAttribute("title", `Open @${igRaw} on Instagram`);
            actionsEl.appendChild(igLink);
            body.appendChild(actionsEl);
          }
        }

        row.appendChild(body);
        li.appendChild(row);
        placesList.appendChild(li);
      }
    }

    async function fetchRecognitionPlaces(resultId) {
      try {
        const response = await fetch(
          `/api/v1/recognitions/result?id=${encodeURIComponent(resultId)}`,
          { headers: { Authorization: `Bearer ${authToken}` } },
        );
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const errMsg =
            body.error?.message ??
            (typeof body.error === "string" ? body.error : null) ??
            "Failed to load recognition result";
          throw new Error(errMsg);
        }
        if (!body.ok || body.data == null) {
          throw new Error(body.error?.message ?? "Invalid result response");
        }
        setError("");
        renderPlacesList(body.data.items);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        setError(message);
        placesList.innerHTML = "";
        const li = document.createElement("li");
        li.className = "place-item muted";
        li.textContent = `Could not load places: ${message}`;
        placesList.appendChild(li);
      }
    }

    async function ensureDevelopmentToken() {
      if (authToken) return;
      const response = await fetch("/dev/token");
      if (!response.ok) {
        throw new Error("Unable to get development token");
      }

      const envelope = await response.json();
      if (!envelope.ok || !envelope.data) {
        throw new Error(envelope.error?.message ?? "Invalid dev token response");
      }
      const data = envelope.data;
      authToken = data.access_token;
      supabaseClient = createClient(data.supabase_url, data.supabase_publishable_key, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
        global: { headers: { Authorization: `Bearer ${authToken}` } },
      });
      await supabaseClient.realtime.setAuth(authToken);
    }

    async function subscribeToRecognitionUpdates(recognitionId) {
      if (!supabaseClient) throw new Error("Supabase client is not initialized");
      if (activeSubscription) {
        await supabaseClient.removeChannel(activeSubscription);
        activeSubscription = null;
      }

      connectionLine.textContent = "Realtime: connecting...";
      activeSubscription = supabaseClient
        .channel(`recognition-${recognitionId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "recognition_tasks",
            filter: `id=eq.${recognitionId}`,
          },
          (payload) => {
            const row = payload.new;
            if (!row || row.id !== activeRecognitionId) return;
            renderStatusList(row.status);
            if (["completed", "failed", "committed", "cancelled", "expired"].includes(row.status)) {
              finalizeDurationTracking();
            }
            renderPayload(payload);
            const resultId = row.result_id;
            if (
              row.status === "completed" &&
              resultId &&
              typeof resultId === "string" &&
              resultId !== lastFetchedResultId
            ) {
              lastFetchedResultId = resultId;
              void fetchRecognitionPlaces(resultId);
            }
          },
        )
        .subscribe((status) => {
          connectionLine.textContent = `Realtime: ${status.toLowerCase()}`;
        });
    }

    async function startRecognition() {
      const sourceUrl = sourceUrlInput.value.trim();
      if (!sourceUrl) return;

      setError("");
      startRecognitionButton.disabled = true;
      startRecognitionButton.textContent = "Starting...";

      try {
        await ensureDevelopmentToken();
        const response = await fetch("/api/v1/recognitions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${authToken}`,
          },
          body: JSON.stringify({ source_url: sourceUrl }),
        });

        const responseBody = await response.json().catch(() => ({}));
        if (!response.ok) {
          const errMsg =
            responseBody.error?.message ??
            (typeof responseBody.error === "string" ? responseBody.error : null) ??
            "Recognition enqueue failed";
          throw new Error(errMsg);
        }

        if (!responseBody.ok || responseBody.data == null) {
          throw new Error(responseBody.error?.message ?? "Invalid recognition response");
        }

        const data = responseBody.data;
        activeRecognitionId = data.recognition_id;
        lastFetchedResultId = null;
        placesList.innerHTML = "";
        const placeholder = document.createElement("li");
        placeholder.className = "place-item muted";
        placeholder.textContent = "—";
        placesList.appendChild(placeholder);
        startDurationTracking();
        recognitionIdentifierLine.textContent = `recognition_id: ${activeRecognitionId}`;
        renderStatusList(data.status);
        renderPayload(responseBody);

        await subscribeToRecognitionUpdates(activeRecognitionId);
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        setError(message);
      } finally {
        startRecognitionButton.disabled = false;
        startRecognitionButton.textContent = "Start Recognition";
      }
    }

    renderStatusList("queued");
    startRecognitionButton.addEventListener("click", () => { void startRecognition(); });
    sourceUrlInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
        void startRecognition();
      }
    });
  </script>
</body>
</html>
